spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# Render may not expose JDBC metadata during startup; keep the PostgreSQL dialect explicit.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://masapakaraju.github.io}

app.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# Admin login is disabled until ADMIN_USERNAME and a strong ADMIN_OTP_HMAC_SECRET are configured.
app.admin.username=${ADMIN_USERNAME:}
app.admin.otp-hmac-secret=${ADMIN_OTP_HMAC_SECRET:}
app.admin.slack-webhook-url=${ADMIN_SLACK_WEBHOOK_URL:}

# Suppress Hibernate's HHH90000025 notice about the explicit dialect above.
logging.level.org.hibernate.orm.deprecation=ERROR
